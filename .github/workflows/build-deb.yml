name: Build plugin .deb

on:
  pull_request:
  push:
    branches: [develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      core-run-id:
        type: string
        default: ""
      targets:
        description: "Only build these codename/arch targets, e.g. 'focal/amd64 bullseye/armhf'"
        type: string
        default: ""
      fledge-ref:
        description: "fledge ref for headers and packaging scripts (match the core you build against, e.g. v3.1.1)"
        type: string
        default: develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deb:
    uses: fledge-iot/fledge/.github/workflows/plugin-deb.yml@develop
    with:
      package: fledge-filter-omfhint
      kind: cpp
      core-run-id: ${{ inputs.core-run-id }}
      targets: ${{ inputs.targets }}
      fledge-ref: ${{ inputs.fledge-ref || 'develop' }}
    secrets: inherit
